<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할일 목록</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>할일 목록</h1>

    <div class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="새 할일을 입력하세요..."
        autocomplete="off"
      />
      <button id="add-btn">추가</button>
    </div>
    <div class="datetime-row">
      <label for="todo-start">시작</label>
      <input type="datetime-local" id="todo-start" />
      <label for="todo-datetime">마감</label>
      <input type="datetime-local" id="todo-datetime" />
      <button id="clear-datetime-btn" title="날짜 지우기">✕</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="active">미완료</button>
        <button class="filter-btn" data-filter="completed">완료</button>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" data-view="list">목록</button>
        <button class="view-btn" data-view="gantt">간트</button>
      </div>
    </div>

    <ul id="list-view"></ul>

    <div id="gantt-view" class="hidden">
      <div class="gantt-scroll-wrap">
        <div id="gantt-inner"></div>
      </div>
    </div>

    <div class="footer">
      <span id="count"></span>
      <button id="clear-btn">완료 항목 삭제</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
